[project]
name = "pdex"
version = "0.3.0"
description = "Parallel differential expression for single-cell perturbation sequencing"
readme = "README.md"
authors = [{ name = "noam teyssier", email = "noam.teyssier@arcinstitute.org" }]
requires-python = ">=3.11"
dependencies = [
    "anndata>=0.12.10",
    "numba>=0.64.0",
    "numba-mwu>=0.2.0",
    "numpy>=2.4.2",
    "pandas>=2.3.3",
    "polars>=1.38.1",
    "pyarrow>=23.0.1",
    "scipy>=1.17.1",
    "tqdm>=4.67.3",
]

[project.optional-dependencies]
# Lazy/backed IO: read_lazy (dask X, xarray obs/var) over local or remote
# zarr/h5ad stores. Core pdex never imports these at module scope.
# anndata[lazy] carries dask/xarray with anndata's own version constraints.
lazy = [
    "anndata[lazy]",
    "zarr>=3.0.0",
    "fsspec>=2024.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pdex[lazy]",
    "pytest>=8.3.5",
    "ruff>=0.15.2",
    "ty>=0.0.18",
]
